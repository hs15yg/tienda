<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Store Pro</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white">

<!-- HEADER -->
<header class="bg-gradient-to-r from-black to-red-900 p-4 shadow-lg flex justify-between items-center">

 <h1 class="text-3xl font-black tracking-wider uppercase text-red-100">
   Music Store
</h1>
 <!--busqueda-->
  <div class="relative w-1/3">
  
  <span class="absolute left-3 top-2.5 text-gray-400">
    🔍
  </span>

  <input 
    id="searchInput"
    type="text"
    placeholder="Buscar..."
    class="p-2 pl-10 rounded bg-black border border-red-900 text-white w-full text-lg"
  />

</div>

  <button onclick="toggleCart()" class="bg-red-800 px-4 py-2 rounded">
    🛒 (<span id="cartCount">0</span>)
  </button>

</header>

<!-- CATEGORÍAS -->
<div class="flex gap-2 p-3 flex-wrap justify-center">
  <button onclick="filterCategory('all')" class="bg-white text-black px-3 py-1 rounded">Todos</button>
  <button onclick="filterCategory('guitarras')" class="bg-red-800 px-3 py-1 rounded">Guitarras</button>
  <button onclick="filterCategory('teclados')" class="bg-red-700 px-3 py-1 rounded">Teclados</button>
  <button onclick="filterCategory('percusion')" class="bg-red-900 px-3 py-1 rounded">Percusión</button>
  <button onclick="filterCategory('viento')" class="bg-gray-700 px-3 py-1 rounded">Viento</button>
</div>

<!-- CONTENIDO -->
<div class="flex">

  <!-- PRODUCTOS -->
  <main class="flex-1 p-3">
    <div id="productList" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3"></div>
  </main>

  <!-- CARRITO -->
  <aside id="cart"
    class="fixed right-0 top-0 h-full w-80 bg-gray-900 border-l border-red-900 p-4 transform translate-x-full transition duration-300">

    <h2 class="text-xl font-bold mb-4">🛒 Carrito</h2>

    <div id="cartItems" class="space-y-2"></div>

    <hr class="my-3 border-red-900">

    <p class="text-red-400 font-bold text-lg">
      Total: $<span id="total">0</span>
    </p>

    <button onclick="toggleCart()" class="mt-4 bg-red-700 w-full py-2 rounded">
      Cerrar
    </button>

  </aside>

</div>

<script src="app.js"></script>
</body>
</html>
